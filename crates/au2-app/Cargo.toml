[package]
name = "au2-app"
edition.workspace = true
version.workspace = true
description = "Playable windowed front-end for the Aurora RTS (winit + softbuffer, software rendered)"

[lib]
name = "au2_app"
path = "src/lib.rs"

[[bin]]
name = "au2-app"
path = "src/main.rs"

[dependencies]
au2-map = { path = "../au2-map" }
au2-sim = { path = "../au2-sim" }
winit = "0.30"
font8x8 = { version = "0.3", default-features = false }
# Sound effects (ogg via the pure-Rust `lewton` decoder). Optional: build with `--no-default-features` for a silent app.
rodio = { version = "0.19", default-features = false, features = ["vorbis"], optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Pinned: softbuffer >= 0.4.7 needs windows-sys 0.61, whose raw-dylib imports require `dlltool.exe` (absent from the
# stock x86_64-pc-windows-gnu toolchain). 0.4.6 uses prebuilt import libraries and links with nothing extra.
# (0.4.6 has no Android backend, so Android presents through the NDK directly: see src/present.rs.)
softbuffer = "=0.4.6"

[target.'cfg(target_os = "android")'.dependencies]
# Same major as the copy winit uses, so there is one `ndk` in the build.
ndk = "0.9"

[features]
default = ["audio"]
audio = ["dep:rodio"]
