[workspace]
resolver = "2"
members = ["crates/au2-music", "crates/au2-map", "crates/au2-sim", "crates/au2-app", "crates/au2-android"]

[workspace.package]
edition = "2021"
version = "0.1.0"

# The simulation runs thousands of ships per tick; keep it fast in debug builds and tests too.
[profile.dev.package.au2-sim]
opt-level = 3
[profile.dev.package.au2-app]
opt-level = 2
